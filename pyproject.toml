[project]
name = "frenchlottery"
version = "0.5.1"
description = "Get up-to-date lottery draws from FDJ"
authors = [{ name = "Nicolas Voisin", email = "voisin.nicolas@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "polars>=1.37.1",
    "requests>=2.32.5",
]

[project.scripts]
frenchlottery = "frenchlottery.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3.4"]


[project.urls]
Homepage = "https://github.com/nick-voisin/frenchlottery"
Issues = "https://github.com/nick-voisin/frenchlottery/issues"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
